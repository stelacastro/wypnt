services:
  - type: web
    name: ton-nft-hub-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: PORT
        value: 8787
      - key: TONAPI_KEY
        sync: false
      - key: GETGEMS_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: TON_COLLECTIONS
        value: EQBMcfMAZlMUr1W3X8kdEw3fJMUAaWH4-XcmE5R5RfFIY0E2
